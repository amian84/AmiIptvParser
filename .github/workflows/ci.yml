# Restore, build, test, and pack on main and pull requests.
# A v* tag also publishes to nuget.org with trusted publishing (OIDC).
# No NuGet API key is stored. Before the first tag, set repository variable
# NUGET_USER and the nuget.org policy. See docs/publishing.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer needs tags and history. A shallow clone versions as 1.0.0-alpha.0.{height}.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AmiIptvParser.slnx

      - name: Build
        run: dotnet build AmiIptvParser.slnx -c Release --no-restore

      - name: Test
        run: dotnet test AmiIptvParser.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack AmiIptvParser/AmiIptvParser.csproj -c Release --no-build --output nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs

      - name: Check the package version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="nupkgs/AmiIptvParser.${version}.nupkg"
          if [ ! -f "$package" ]; then
            echo "::error::Expected ${package}. The tag is not a MinVer version (use v1.2.3 or v1.2.3-preview.1). See docs/publishing.md."
            ls -la nupkgs
            exit 1
          fi

      - name: Require nuget.org username
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org profile name (not the email, not an API key). See docs/publishing.md."
            exit 1
          fi

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push package
        run: dotnet nuget push nupkgs/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
